name: Something isn’t working
description: A bug in My Own Data Center
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open …\n2. Tap …"
  - type: input
    id: version
    attributes:
      label: My Own Data Center version
      description: Settings → Software update shows it.
      placeholder: 0.9.12
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Phone or tablet layout
        - Desktop layout
        - The server itself (install, services)
        - Not sure
  - type: input
    id: machine
    attributes:
      label: Server hardware
      placeholder: "Bare metal (Ryzen, 2 drives) / a VM on Proxmox / …"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "On the server: journalctl --user -u omarchyd -u omarchy-server-web -n 100. Remove anything private first."
      render: text
